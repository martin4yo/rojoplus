# ─── Redirect HTTP → HTTPS (todos los dominios) ───────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name clubix.com.ar www.clubix.com.ar *.clubix.com.ar;
    return 301 https://$host$request_uri;
}

# ─── HTTPS — clubix.com.ar y www → sitio web institucional ───────────────────
server {
    listen 443 ssl http2;
    server_name clubix.com.ar www.clubix.com.ar;

    ssl_certificate     /etc/letsencrypt/live/clubix.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubix.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/clubix-web-access.log;
    error_log  /var/log/nginx/clubix-web-error.log;

    root /var/www/clubix/web;
    index index.html;

    # Favicon compartido con la app
    location = /favicon.png {
        alias /var/www/clubix/client/dist/favicon-clubix.png;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# ─── HTTPS — *.clubix.com.ar → app React por tenant ──────────────────────────
server {
    listen 443 ssl http2;
    server_name *.clubix.com.ar;

    ssl_certificate     /etc/letsencrypt/live/clubix.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubix.com.ar/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    access_log /var/log/nginx/clubix-access.log;
    error_log  /var/log/nginx/clubix-error.log;

    client_max_body_size 20M;

    # ── API Backend ──────────────────────────────────────────────────────────
    location /api {
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
    }

    # ── Socket.io (WebSocket nativo) ─────────────────────────────────────────
    location /socket.io {
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Archivos subidos por tenants ──────────────────────────────────────────
    # ^~ tiene prioridad sobre regex locations (~*), evita que el bloque de
    # imágenes intercepte rutas como /uploads/tenants/logo.png
    location ^~ /uploads {
        alias /var/www/clubix/server/uploads;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── Frontend (React SPA) ─────────────────────────────────────────────────
    root /var/www/clubix/client/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
