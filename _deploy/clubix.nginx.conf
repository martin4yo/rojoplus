# HTTP -> HTTPS (apex + www + subdominios)
server {
    listen 80;
    listen [::]:80;
    server_name clubix.com.ar www.clubix.com.ar *.clubix.com.ar;
    return 301 https://$host$request_uri;
}

# ===================================================================
# Sitio institucional estatico (apex + www)  ->  /var/www/clubix/web
# ===================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clubix.com.ar www.clubix.com.ar;

    ssl_certificate     /etc/letsencrypt/live/clubix.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubix.com.ar/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "SAMEORIGIN"          always;
    add_header X-Content-Type-Options       "nosniff"             always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/clubix-web-access.log;
    error_log  /var/log/nginx/clubix-web-error.log;

    client_max_body_size 20M;

    root /var/www/clubix/web;
    index index.html;

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* \.(?:bak|sql|env|log|conf|ini|swp|md)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:js|css|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}

# ===================================================================
# App SPA multi-tenant (subdominios)  ->  /var/www/clubix/client/dist
# ===================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.clubix.com.ar;
    ssl_certificate     /etc/letsencrypt/live/clubix.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubix.com.ar/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options              "SAMEORIGIN"          always;
    add_header X-Content-Type-Options       "nosniff"             always;
    add_header X-XSS-Protection             "1; mode=block"       always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy           "camera=(), microphone=(), geolocation=(self), payment=(self)" always;
    add_header Cross-Origin-Opener-Policy   "same-origin"         always;
    add_header Cross-Origin-Resource-Policy "same-site"           always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://sdk.mercadopago.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.mercadopago.com wss: https:; frame-src 'self' blob: https://www.google.com https://www.mercadopago.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    access_log /var/log/nginx/clubix-access.log;
    error_log  /var/log/nginx/clubix-error.log;
    client_max_body_size 20M;
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }
    location ~* \.(?:bak|sql|env|log|conf|ini|swp)$ { deny all; }
    location /api {
        limit_req  zone=api_zone burst=60 nodelay;
        limit_conn conn_zone 20;
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    120s;
        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
    }
    location = /api/admin/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io {
        proxy_pass http://127.0.0.1:5400;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
    location ^~ /uploads {
        alias /var/www/clubix/server/uploads;
        expires 30d;
        add_header Cache-Control "public";
        location ~* \.(php|pl|py|sh|cgi|js|html?)$ { deny all; }
    }
    root /var/www/clubix/client/dist;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
