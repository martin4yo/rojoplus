<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor Molinete - RojoPlus</title>
  <script src="lucide.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    header {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    h1 {
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 svg {
      width: 28px;
      height: 28px;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h2 svg {
      width: 20px;
      height: 20px;
    }

    .status-badges {
      display: flex;
      gap: 10px;
    }

    .badge {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge svg {
      width: 10px;
      height: 10px;
    }

    .badge.online { background: #10b981; }
    .badge.offline { background: #ef4444; }
    .badge.warning { background: #f59e0b; }

    .main-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      min-height: 0;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 0;
    }

    .card {
      background: #2d2d2d;
      border-radius: 10px;
      padding: 20px;
    }

    .card.stream-card {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
      border-bottom: 2px solid #444;
      padding-bottom: 10px;
    }

    /* Pantalla de molinete */
    #pantalla-molinete {
      height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 10px;
      border: 4px solid #333;
      transition: all 0.3s ease;
    }

    #pantalla-molinete.permitido {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-color: #10b981;
    }

    #pantalla-molinete.denegado {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      border-color: #ef4444;
    }

    #pantalla-molinete .icono {
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pantalla-molinete .icono svg {
      width: 80px;
      height: 80px;
    }

    #pantalla-molinete .icono.spin svg {
      animation: spin 1.5s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #pantalla-molinete .titulo {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #pantalla-molinete .mensaje {
      font-size: 18px;
      opacity: 0.9;
    }

    /* Stream de accesos */
    #stream-accesos {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .acceso-item {
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 4px solid;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .acceso-item.permitido {
      background: rgba(16, 185, 129, 0.1);
      border-color: #10b981;
    }

    .acceso-item.denegado {
      background: rgba(239, 68, 68, 0.1);
      border-color: #ef4444;
    }

    .acceso-info {
      flex: 1;
    }

    .acceso-nombre {
      font-weight: bold;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .acceso-nombre svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .acceso-item.permitido .acceso-nombre svg {
      color: #10b981;
    }

    .acceso-item.denegado .acceso-nombre svg {
      color: #ef4444;
    }

    .acceso-detalle {
      font-size: 12px;
      opacity: 0.7;
    }

    .acceso-hora {
      font-size: 14px;
      opacity: 0.8;
    }

    /* Estadísticas */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat-card {
      text-align: center;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: #3b82f6;
      color: white;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-success {
      background: #10b981;
      color: white;
    }

    .btn-success:hover {
      background: #059669;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    ::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>
        <img id="tenant-logo" src="" alt="" style="height: 36px; display: none;" />
        <i data-lucide="door-open" id="title-icon"></i>
        <span>Monitor Molinete</span>
        <span id="tenant-nombre" style="opacity: 0.7; font-weight: normal; margin-left: 8px;"></span>
      </h1>
      <div class="status-badges">
        <div class="badge offline" id="badge-api">
          <i data-lucide="circle" fill="currentColor"></i> API
        </div>
        <div class="badge offline" id="badge-usb">
          <i data-lucide="circle" fill="currentColor"></i> USB
        </div>
        <div class="badge offline" id="badge-rfid">
          <i data-lucide="circle" fill="currentColor"></i> RFID
        </div>
        <div class="badge offline" id="badge-molinete">
          <i data-lucide="circle" fill="currentColor"></i> Molinete
        </div>
      </div>
    </header>

    <div class="main-layout">
      <!-- Columna izquierda: pantalla arriba, stats abajo -->
      <div class="left-column">
        <div class="card">
          <h2><i data-lucide="monitor"></i> Pantalla Molinete</h2>
          <div id="pantalla-molinete">
            <div class="icono spin"><i data-lucide="loader"></i></div>
            <div class="titulo">Sistema Iniciando...</div>
            <div class="mensaje">Esperando conexión</div>
          </div>
          <div class="actions">
            <button class="btn btn-success" onclick="abrirMolinete()">
              <i data-lucide="door-open"></i> Abrir Molinete
            </button>
            <button class="btn btn-primary" onclick="sincronizar()">
              <i data-lucide="refresh-cw"></i> Sincronizar
            </button>
          </div>
        </div>

        <div class="card">
          <h2><i data-lucide="bar-chart-3"></i> Estadísticas del Sistema</h2>
          <div class="stats">
            <div class="stat-card">
              <div class="stat-value" id="stat-socios">-</div>
              <div class="stat-label">Socios en Cache</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-habilitaciones">-</div>
              <div class="stat-label">Habilitaciones</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-pendientes">-</div>
              <div class="stat-label">Registros Pendientes</div>
            </div>
          </div>
          <div style="margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 6px;">
            <div style="font-size: 12px; opacity: 0.7; margin-bottom: 5px;">ÚLTIMA SINCRONIZACIÓN</div>
            <div style="font-size: 16px;" id="stat-ultimo-sync">Nunca</div>
          </div>
          <div style="margin-top: 20px; padding: 15px; background: #1a1a1a; border-radius: 6px;">
            <div style="font-size: 12px; opacity: 0.7; margin-bottom: 5px;">UPTIME</div>
            <div style="font-size: 16px;" id="stat-uptime">-</div>
          </div>
        </div>
      </div>

      <!-- Columna derecha: stream ocupando todo el alto -->
      <div class="card stream-card">
        <h2><i data-lucide="list"></i> Últimos Accesos</h2>
        <div id="stream-accesos">
          <div style="text-align: center; opacity: 0.5; padding: 40px;">
            Esperando eventos...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ws = null
    const accesos = []

    // Helper: escapa texto para inserción en HTML
    function escapeHtml(str) {
      if (str == null) return ''
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    // Helper: inicializa iconos Lucide de manera segura
    function renderIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons()
      }
    }

    // Mapea estado de pantalla a icono Lucide
    function iconoParaEstado(estado) {
      if (estado === 'PERMITIDO') return { nombre: 'check-circle-2', spin: false }
      if (estado === 'INHABILITADO') return { nombre: 'x-circle', spin: false }
      return { nombre: 'loader', spin: true }
    }

    // Conectar WebSocket
    function conectarWebSocket() {
      ws = new WebSocket('ws://localhost:3002/ws')

      ws.onopen = () => {
        console.log('WebSocket conectado')
        cargarEstadoInicial()
      }

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data)
        console.log('Mensaje recibido:', data)

        if (data.tipo === 'ACCESO') {
          agregarAcceso(data.data)
        } else if (data.tipo === 'PANTALLA') {
          mostrarPantalla(data.data)
        }
      }

      ws.onerror = (error) => {
        console.error('Error WebSocket:', error)
      }

      ws.onclose = () => {
        console.log('WebSocket desconectado, reconectando...')
        setTimeout(conectarWebSocket, 3000)
      }
    }

    // Cargar estado inicial
    async function cargarEstadoInicial() {
      try {
        const response = await fetch('/api/status')
        const data = await response.json()

        if (data.success) {
          // Actualizar badges de conexión
          actualizarBadge('api', data.data.conexion.api)
          actualizarBadge('usb', data.data.conexion.usb)
          actualizarBadge('rfid', data.data.conexion.rfid)
          actualizarBadge('molinete', data.data.conexion.molinete)

          // Actualizar estadísticas
          document.getElementById('stat-socios').textContent = data.data.cache.sociosEnCache
          document.getElementById('stat-habilitaciones').textContent = data.data.cache.habilitacionesEnCache
          document.getElementById('stat-pendientes').textContent = data.data.cache.registrosPendientes

          if (data.data.cache.ultimoSync) {
            const fecha = new Date(data.data.cache.ultimoSync)
            document.getElementById('stat-ultimo-sync').textContent = fecha.toLocaleString('es-AR')
          }

          const uptime = Math.floor(data.data.uptime)
          const horas = Math.floor(uptime / 3600)
          const minutos = Math.floor((uptime % 3600) / 60)
          document.getElementById('stat-uptime').textContent = `${horas}h ${minutos}m`
        }
      } catch (error) {
        console.error('Error cargando estado:', error)
      }
    }

    // Actualizar badge de conexión
    function actualizarBadge(tipo, conectado) {
      const badge = document.getElementById(`badge-${tipo}`)
      if (conectado) {
        badge.classList.remove('offline')
        badge.classList.add('online')
      } else {
        badge.classList.remove('online')
        badge.classList.add('offline')
      }
    }

    // Agregar acceso al stream
    function agregarAcceso(acceso) {
      accesos.unshift(acceso)
      if (accesos.length > 50) accesos.pop()

      const stream = document.getElementById('stream-accesos')
      stream.innerHTML = accesos.map(a => {
        const fecha = new Date(a.fecha)
        const clase = a.resultado === 'PERMITIDO' ? 'permitido' : 'denegado'
        const iconoNombre = a.resultado === 'PERMITIDO' ? 'user-check' : 'user-x'

        return `
          <div class="acceso-item ${clase}">
            <div class="acceso-info">
              <div class="acceso-nombre">
                <i data-lucide="${iconoNombre}"></i>
                <span>${escapeHtml(a.persona?.nombre || 'Sin nombre')}</span>
              </div>
              <div class="acceso-detalle">
                ${escapeHtml(a.tipoLectura)} • ${escapeHtml(a.motivo)} • ${escapeHtml(a.mensaje)}
              </div>
            </div>
            <div class="acceso-hora">
              ${fecha.toLocaleTimeString('es-AR')}
            </div>
          </div>
        `
      }).join('')
      renderIcons()
    }

    // Mostrar en pantalla del molinete
    function mostrarPantalla(data) {
      const pantalla = document.getElementById('pantalla-molinete')

      // Resetear clases
      pantalla.className = ''

      // Aplicar clase según estado
      if (data.estado === 'PERMITIDO') {
        pantalla.classList.add('permitido')
      } else if (data.estado === 'INHABILITADO') {
        pantalla.classList.add('denegado')
      }

      const icono = iconoParaEstado(data.estado)

      // Actualizar contenido (ignora data.icono emoji del backend; usa Lucide por estado)
      pantalla.innerHTML = `
        <div class="icono${icono.spin ? ' spin' : ''}"><i data-lucide="${icono.nombre}"></i></div>
        <div class="titulo">${escapeHtml(data.titulo)}</div>
        <div class="mensaje">${escapeHtml(data.mensaje)}</div>
      `
      renderIcons()

      // Volver a estado normal después de la duración
      setTimeout(() => {
        pantalla.className = ''
        pantalla.innerHTML = `
          <div class="icono spin"><i data-lucide="loader"></i></div>
          <div class="titulo">Esperando...</div>
          <div class="mensaje">Acerque su credencial</div>
        `
        renderIcons()
      }, data.duracion || 3000)
    }

    // Abrir molinete manualmente
    async function abrirMolinete() {
      try {
        const response = await fetch('/api/abrir', { method: 'POST' })
        const data = await response.json()
        if (data.success) {
          alert('Molinete abierto')
        }
      } catch (error) {
        alert('Error abriendo molinete: ' + error.message)
      }
    }

    // Sincronizar cache
    async function sincronizar() {
      try {
        const response = await fetch('/api/sync', { method: 'POST' })
        const data = await response.json()
        if (data.success) {
          alert('Sincronización iniciada')
          setTimeout(cargarEstadoInicial, 2000)
        }
      } catch (error) {
        alert('Error sincronizando: ' + error.message)
      }
    }

    // Actualizar estado cada 10 segundos
    setInterval(cargarEstadoInicial, 10000)

    // ===================================================
    // CAPTURA DE LECTORES USB EN MODO TECLADO
    // ===================================================
    // Los lectores de código de barras / QR tipean el código + Enter.
    // Acumulamos teclas en un buffer y lo enviamos al backend al recibir Enter.
    // Un timeout entre teclas descarta escritura humana (muy lenta).
    const TECLADO_TIMEOUT_MS = 80   // tiempo máx entre teclas (humano ~150-300ms, lector <20ms)
    const TECLADO_MIN_LARGO = 4     // largo mínimo para considerar lectura válida
    let tecladoBuffer = ''
    let tecladoUltimaTecla = 0

    async function enviarLecturaTeclado(valorLeido) {
      try {
        await fetch('/api/lectura-teclado', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ valorLeido })
        })
      } catch (error) {
        console.error('Error enviando lectura:', error)
      }
    }

    document.addEventListener('keydown', (e) => {
      // Ignorar si hay un input/textarea enfocado
      const tag = (e.target?.tagName || '').toUpperCase()
      if (tag === 'INPUT' || tag === 'TEXTAREA') {
        console.log('[lector] keydown ignorado (foco en', tag, ')')
        return
      }

      const ahora = Date.now()
      const delta = ahora - tecladoUltimaTecla
      tecladoUltimaTecla = ahora

      console.log('[lector] keydown:', { key: e.key, code: e.code, delta, bufferActual: tecladoBuffer })

      // Si pasó demasiado tiempo desde la última tecla, reiniciar buffer
      if (delta > TECLADO_TIMEOUT_MS && tecladoBuffer.length > 0) {
        console.log('[lector] buffer reseteado por timeout (delta=' + delta + 'ms)')
        tecladoBuffer = ''
      }

      // Fin de lectura: Enter o Tab
      if (e.key === 'Enter' || e.key === 'Tab') {
        const valor = tecladoBuffer
        tecladoBuffer = ''
        console.log('[lector] fin de lectura. Valor="' + valor + '" largo=' + valor.length)
        if (valor.length >= TECLADO_MIN_LARGO) {
          console.log('[lector] ENVIANDO al backend:', valor)
          enviarLecturaTeclado(valor)
        } else {
          console.log('[lector] DESCARTADO (muy corto, min=' + TECLADO_MIN_LARGO + ')')
        }
        return
      }

      // Acumular solo caracteres imprimibles (length 1 filtra Shift, Ctrl, F-keys, etc)
      if (e.key.length === 1) {
        tecladoBuffer += e.key
      }
    })
    console.log('[lector] capturador de teclado activo. Escaneá un código para probar.')

    // Cargar info del tenant (logo + nombre)
    async function cargarTenantInfo() {
      try {
        const res = await fetch('/api/tenant-info')
        const data = await res.json()
        if (!data.success || !data.data) return
        const { nombre, logoUrl } = data.data
        if (nombre) {
          document.getElementById('tenant-nombre').textContent = `· ${nombre}`
          document.title = `Monitor Molinete · ${nombre}`
        }
        if (logoUrl) {
          const img = document.getElementById('tenant-logo')
          img.src = logoUrl
          img.alt = nombre || 'Logo'
          img.style.display = 'block'
          document.getElementById('title-icon').style.display = 'none'
        }
      } catch (_) {}
    }

    // Render inicial de iconos + iniciar
    renderIcons()
    cargarTenantInfo()
    conectarWebSocket()
  </script>
</body>
</html>
