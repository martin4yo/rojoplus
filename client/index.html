<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/LogoClubixSolo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Clubix - Gestión Inteligente" />
    <meta name="theme-color" content="#DC2626" />

    <!-- Open Graph / WhatsApp preview (logo genérico Clubix; URL absoluta fija) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clubix" />
    <meta property="og:title" content="Clubix - Gestión Inteligente" />
    <meta property="og:description" content="Plataforma de gestión para clubes y entidades deportivas." />
    <meta property="og:image" content="https://clubix.com.ar/LogoClubixSolo.png" />
    <meta property="og:image:width" content="173" />
    <meta property="og:image:height" content="156" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Clubix - Gestión Inteligente" />
    <meta name="twitter:description" content="Plataforma de gestión para clubes y entidades deportivas." />
    <meta name="twitter:image" content="https://clubix.com.ar/LogoClubixSolo.png" />

    <!-- El manifest se setea dinámicamente por tenant y contexto en PwaManifest.jsx -->
    <link rel="manifest" href="/api/pwa/manifest?context=socio" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clubix" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <link rel="apple-touch-startup-image" href="/images/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Clubix - Gestión Inteligente</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
