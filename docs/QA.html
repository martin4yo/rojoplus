<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QA — Clubix / RojoPlus</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto; }
  .sev-critical { background: #fee2e2; color: #991b1b; }
  .sev-important { background: #fef3c7; color: #92400e; }
  .sev-cosmetic { background: #dbeafe; color: #1e40af; }
  .status-pending { color: #9ca3af; }
  .status-passed { color: #16a34a; }
  .status-failed { color: #dc2626; }
  .item-passed { background: #f0fdf4; border-color: #bbf7d0; }
  .item-failed { background: #fef2f2; border-color: #fecaca; }
  .item-blocked { background: #fefce8; border-color: #fde68a; }
  .group-btn:hover { background: #eef2ff; }
  .group-btn.active { background: #4f46e5; color: white; }
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  .progress-fill { transition: width 0.3s ease; }
  @media print {
    aside, .no-print { display: none !important; }
    main { width: 100% !important; }
    .item-row { break-inside: avoid; }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<div id="app" class="min-h-screen">

        QA — Clubix
      </h1>
      <div class="text-xs text-slate-500" id="lastSavedLabel">Sin cambios</div>
      <div class="flex-1"></div>
      <input type="text" id="searchInput" placeholder="Buscar item..." class="border border-slate-300 rounded-md px-3 py-1.5 text-sm w-56 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <div class="flex items-center gap-1 text-xs">
        <button data-filter="all" class="filter-btn px-2 py-1 rounded border bg-indigo-600 text-white border-indigo-600">Todos</button>
        <button data-filter="pending" class="filter-btn px-2 py-1 rounded border bg-white border-slate-300 text-slate-700">Pendientes</button>
        <button data-filter="passed" class="filter-btn px-2 py-1 rounded border bg-white border-slate-300 text-slate-700">Aprobados</button>
        <button data-filter="failed" class="filter-btn px-2 py-1 rounded border bg-white border-slate-300 text-slate-700">Fallados</button>
        <button data-filter="blocked" class="filter-btn px-2 py-1 rounded border bg-white border-slate-300 text-slate-700">Bloqueados</button>
      </div>
      <div class="flex items-center gap-1 text-xs ml-2">
        <button data-sev-filter="all" class="sev-filter-btn px-2 py-1 rounded border bg-slate-700 text-white border-slate-700">Todas</button>
        <button data-sev-filter="critical" class="sev-filter-btn px-2 py-1 rounded border bg-white border-red-200 text-red-700">🔴</button>
        <button data-sev-filter="important" class="sev-filter-btn px-2 py-1 rounded border bg-white border-amber-200 text-amber-700">🟡</button>
        <button data-sev-filter="cosmetic" class="sev-filter-btn px-2 py-1 rounded border bg-white border-blue-200 text-blue-700">🔵</button>
      </div>
      <div class="flex items-center gap-1 ml-2">
        <button id="exportBtn" class="px-3 py-1.5 rounded bg-emerald-600 text-white text-sm hover:bg-emerald-700">Exportar reporte</button>
        <button id="printBtn" class="px-3 py-1.5 rounded bg-slate-100 text-slate-700 text-sm hover:bg-slate-200">Imprimir</button>
        <button id="resetBtn" class="px-3 py-1.5 rounded bg-rose-100 text-rose-700 text-sm hover:bg-rose-200">Reset</button>
      </div>
    </div>
    <!-- Overall progress -->
    <div class="px-4 pb-2">
      <div class="flex items-center gap-3 text-xs text-slate-600">
        <span id="overallStats" class="font-medium">0 / 0 completados</span>
        <div class="flex-1 bg-slate-200 rounded-full h-2 overflow-hidden">
          <div id="overallProgress" class="progress-fill bg-emerald-500 h-2" style="width: 0%"></div>
        </div>
        <span id="overallPercent" class="font-medium tabular-nums">0%</span>
      </div>
    </div>
  </header>

  <!-- Layout -->
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-72 bg-white border-r border-slate-200 sticky top-[97px] self-start max-h-[calc(100vh-97px)] overflow-y-auto no-print">
      <nav id="sidebar" class="p-2 text-sm"></nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6 max-w-5xl">
      <div id="moduleContainer"></div>

      <!-- Defectos -->
      <section class="mt-12 bg-white border border-rose-200 rounded-xl p-5 shadow-sm">
        <h2 class="text-lg font-bold text-rose-700 flex items-center gap-2 mb-3">
          <span>🐞</span> Defectos detectados
        </h2>
        <div id="defectsList" class="space-y-3 mb-4 text-sm text-slate-600"></div>
        <details class="border border-slate-200 rounded-lg p-3">
          <summary class="font-medium text-slate-700">+ Agregar defecto manual</summary>
          <div class="mt-3 space-y-2">
            <input id="defectTitle" type="text" placeholder="Título del defecto" class="w-full border border-slate-300 rounded px-2 py-1 text-sm" />
            <textarea id="defectDesc" placeholder="Descripción / pasos para reproducir / resultado esperado vs actual..." rows="3" class="w-full border border-slate-300 rounded px-2 py-1 text-sm"></textarea>
            <div class="flex items-center gap-2">
              <select id="defectSev" class="border border-slate-300 rounded px-2 py-1 text-sm">
                <option value="critical">🔴 Crítico</option>
                <option value="important" selected>🟡 Importante</option>
                <option value="cosmetic">🔵 Cosmético</option>
              </select>
              <button id="addDefectBtn" class="px-3 py-1 rounded bg-rose-600 text-white text-sm hover:bg-rose-700">Agregar</button>
            </div>
          </div>
        </details>
      </section>

      <!-- Footer -->
      <footer class="mt-8 text-center text-xs text-slate-400">
        QA Clubix — los datos se guardan en localStorage de este navegador. Para reportar al equipo usá "Exportar reporte".
      </footer>
    </main>
  </div>
</div>

// ─── ESTADO ──────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'qa-clubix-state-v1';
const DEFECTS_KEY = 'qa-clubix-defects-v1';

let state = loadState();
let defects = loadDefects();
let activeModuleId = null;
let activeFilter = 'all';
let activeSevFilter = 'all';
let searchQuery = '';

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { return {}; }
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  document.getElementById('lastSavedLabel').textContent = `Guardado ${new Date().toLocaleTimeString()}`;
}
function loadDefects() {
  try { return JSON.parse(localStorage.getItem(DEFECTS_KEY)) || []; }
  catch { return []; }
}
function saveDefects() {
  localStorage.setItem(DEFECTS_KEY, JSON.stringify(defects));
}

// Asegurar IDs estables item.id = mod.id + '-' + idx
function itemId(modId, idx) { return `${modId}--${idx}`; }

// Conjunto plano de todos los items
function allItems() {
  const out = [];
  for (const sec of QA_DATA) {
    for (const mod of sec.modules) {
      mod.items.forEach((text, idx) => {
        out.push({
          id: itemId(mod.id, idx),
          text,
          modId: mod.id,
          modName: mod.name,
          section: sec.section,
          severity: mod.severity,
        });
      });
    }
  }
  return out;
}

function moduleProgress(mod) {
  let done = 0, failed = 0, blocked = 0, total = mod.items.length;
  mod.items.forEach((_, idx) => {
    const s = state[itemId(mod.id, idx)]?.status || 'pending';
    if (s === 'passed') done++;
    else if (s === 'failed') failed++;
    else if (s === 'blocked') blocked++;
  });
  return { done, failed, blocked, total };
}

function overallProgress() {
  const all = allItems();
  let done = 0, failed = 0;
  for (const it of all) {
    const s = state[it.id]?.status || 'pending';
    if (s === 'passed') done++;
    else if (s === 'failed') failed++;
  }
  return { done, failed, total: all.length };
}

// ─── RENDER SIDEBAR ──────────────────────────────────────────────────────────
function renderSidebar() {
  const root = document.getElementById('sidebar');
  let html = '';
  for (const sec of QA_DATA) {
    html += `<details open class="mb-1">
      <summary class="px-2 py-1 font-semibold text-slate-600 text-xs uppercase tracking-wide flex items-center justify-between">
        <span>${sec.section}</span>
      </summary>
      <div class="ml-1">`;
    for (const mod of sec.modules) {
      const p = moduleProgress(mod);
      const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
      const sevDot = mod.severity === 'critical' ? '🔴' : mod.severity === 'important' ? '🟡' : '🔵';
      const failedTag = p.failed ? `<span class="ml-1 text-rose-500 font-bold" title="${p.failed} fallados">!</span>` : '';
      const isActive = activeModuleId === mod.id;
      html += `<button class="group-btn w-full text-left px-2 py-1.5 rounded mb-0.5 ${isActive ? 'active' : ''}" data-mod="${mod.id}">
        <div class="flex items-center gap-1.5">
          <span class="text-xs">${sevDot}</span>
          <span class="text-sm flex-1 truncate">${mod.name}</span>
          <span class="text-[10px] tabular-nums text-slate-400 group-btn-active:text-white">${p.done}/${p.total}</span>
          ${failedTag}
        </div>
        <div class="mt-1 h-1 bg-slate-200 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-1" style="width:${pct}%"></div>
        </div>
      </button>`;
    }
    html += `</div></details>`;
  }
  root.innerHTML = html;

  root.querySelectorAll('.group-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeModuleId = btn.dataset.mod;
      renderSidebar();
      renderModule();
    });
  });
}

// ─── RENDER MODULE ───────────────────────────────────────────────────────────
function findModule(id) {
  for (const sec of QA_DATA) {
    for (const mod of sec.modules) if (mod.id === id) return { sec, mod };
  }
  return null;
}

function statusIcon(s) {
  if (s === 'passed') return '<span class="status-passed text-lg">✓</span>';
  if (s === 'failed') return '<span class="status-failed text-lg">✗</span>';
  if (s === 'blocked') return '<span class="text-amber-500 text-lg">⊘</span>';
  return '<span class="status-pending text-lg">○</span>';
}

function passesFilter(item) {
  if (activeSevFilter !== 'all' && item.severity !== activeSevFilter) return false;
  const s = state[item.id]?.status || 'pending';
  if (activeFilter !== 'all' && s !== activeFilter) return false;
  if (searchQuery && !item.text.toLowerCase().includes(searchQuery.toLowerCase()) && !item.modName.toLowerCase().includes(searchQuery.toLowerCase())) return false;
  return true;
}

function renderModule() {
  const root = document.getElementById('moduleContainer');
  if (!activeModuleId) {
    // Modo búsqueda: si hay query o filtros, mostrar todos los matches; si no, instrucciones
    if (searchQuery || activeFilter !== 'all' || activeSevFilter !== 'all') {
      const matches = allItems().filter(passesFilter);
      root.innerHTML = renderItemsAsList(matches, 'Resultados', `${matches.length} ítem(s) coinciden`);
      bindItemEvents();
      return;
    }
    root.innerHTML = `
      <div class="bg-white border border-slate-200 rounded-xl p-12 text-center">
        <div class="text-5xl mb-4">📋</div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">QA Funcional Clubix</h2>
        <p class="text-sm text-slate-500 max-w-md mx-auto">
          Seleccioná un módulo de la barra lateral o usá el buscador.
          Cada item tiene 4 estados: pendiente, aprobado, fallado, bloqueado.
          Los datos quedan en este navegador (localStorage).
        </p>
      </div>`;
    return;
  }

  const found = findModule(activeModuleId);
  if (!found) { root.innerHTML = '<div>Módulo no encontrado</div>'; return; }
  const { sec, mod } = found;
  const items = mod.items.map((text, idx) => ({
    id: itemId(mod.id, idx),
    text, modId: mod.id, modName: mod.name, section: sec.section, severity: mod.severity,
  })).filter(passesFilter);

  const p = moduleProgress(mod);
  const pct = p.total ? Math.round((p.done / p.total) * 100) : 0;
  const sevBadge = `<span class="px-2 py-0.5 rounded text-xs font-medium sev-${mod.severity}">${mod.severity === 'critical' ? '🔴 Crítico' : mod.severity === 'important' ? '🟡 Importante' : '🔵 Cosmético'}</span>`;

  root.innerHTML = `
    <div class="mb-4">
      <div class="text-xs uppercase tracking-wide text-indigo-600 font-semibold">${sec.section}</div>
      <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-3 mt-1">
        ${mod.name} ${sevBadge}
      </h2>
      <div class="mt-2 flex items-center gap-3 text-sm text-slate-600">
        <span><span class="text-emerald-600 font-semibold">${p.done}</span> aprobados</span>
        <span><span class="text-rose-600 font-semibold">${p.failed}</span> fallados</span>
        <span><span class="text-amber-600 font-semibold">${p.blocked}</span> bloqueados</span>
        <span><span class="text-slate-500 font-semibold">${p.total - p.done - p.failed - p.blocked}</span> pendientes</span>
        <div class="flex-1 bg-slate-200 rounded-full h-2 overflow-hidden ml-2">
          <div class="bg-emerald-500 h-2" style="width:${pct}%"></div>
        </div>
        <span class="font-semibold tabular-nums">${pct}%</span>
      </div>
    </div>
    <div class="space-y-2">
      ${items.map(renderItem).join('') || '<div class="text-slate-400 italic text-sm py-8 text-center">No hay items que coincidan con los filtros.</div>'}
    </div>
  `;
  bindItemEvents();
}

function renderItemsAsList(items, title, subtitle) {
  const grouped = {};
  for (const it of items) {
    const key = `${it.section} → ${it.modName}`;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(it);
  }
  let html = `<h2 class="text-2xl font-bold text-slate-900 mb-1">${title}</h2><p class="text-sm text-slate-500 mb-4">${subtitle}</p>`;
  for (const [k, arr] of Object.entries(grouped)) {
    html += `<div class="mb-4">
      <h3 class="text-xs uppercase tracking-wide font-semibold text-indigo-600 mb-2">${k}</h3>
      <div class="space-y-2">${arr.map(renderItem).join('')}</div>
    </div>`;
  }
  return html;
}

function renderItem(item) {
  const entry = state[item.id] || { status: 'pending', notes: '' };
  const cls = entry.status === 'passed' ? 'item-passed' : entry.status === 'failed' ? 'item-failed' : entry.status === 'blocked' ? 'item-blocked' : 'bg-white border-slate-200';
  const sev = item.severity === 'critical' ? '🔴' : item.severity === 'important' ? '🟡' : '🔵';
  return `
    <div class="item-row border rounded-lg p-3 ${cls} flex items-start gap-3" data-id="${item.id}">
      <button class="status-cycle flex-shrink-0 mt-0.5" data-id="${item.id}" title="Click para ciclar estado">
        ${statusIcon(entry.status || 'pending')}
      </button>
      <div class="flex-1 min-w-0">
        <div class="flex items-start gap-2">
          <div class="flex-1 text-sm text-slate-800">${item.text}</div>
          <div class="flex items-center gap-1 flex-shrink-0">
            <span class="text-xs">${sev}</span>
            <button class="status-set text-xs px-1.5 py-0.5 rounded ${entry.status === 'passed' ? 'bg-emerald-600 text-white' : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100'}" data-id="${item.id}" data-status="passed" title="Aprobado">✓</button>
            <button class="status-set text-xs px-1.5 py-0.5 rounded ${entry.status === 'failed' ? 'bg-rose-600 text-white' : 'bg-rose-50 text-rose-700 hover:bg-rose-100'}" data-id="${item.id}" data-status="failed" title="Fallado">✗</button>
            <button class="status-set text-xs px-1.5 py-0.5 rounded ${entry.status === 'blocked' ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-700 hover:bg-amber-100'}" data-id="${item.id}" data-status="blocked" title="Bloqueado">⊘</button>
            <button class="toggle-notes text-xs px-1.5 py-0.5 rounded bg-slate-50 text-slate-600 hover:bg-slate-100" data-id="${item.id}" title="Notas">📝${entry.notes ? '·' : ''}</button>
          </div>
        </div>
        <textarea class="notes-area w-full mt-2 border border-slate-200 rounded p-2 text-xs ${entry.notes ? '' : 'hidden'}" data-id="${item.id}" placeholder="Notas, capturas, pasos para reproducir...">${entry.notes || ''}</textarea>
      </div>
    </div>`;
}

function bindItemEvents() {
  document.querySelectorAll('.status-cycle').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const cur = state[id]?.status || 'pending';
      const next = cur === 'pending' ? 'passed' : cur === 'passed' ? 'failed' : cur === 'failed' ? 'blocked' : 'pending';
      setStatus(id, next);
    });
  });
  document.querySelectorAll('.status-set').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const newStatus = btn.dataset.status;
      const cur = state[id]?.status || 'pending';
      setStatus(id, cur === newStatus ? 'pending' : newStatus);
    });
  });
  document.querySelectorAll('.toggle-notes').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const ta = document.querySelector(`.notes-area[data-id="${id}"]`);
      if (ta) {
        ta.classList.toggle('hidden');
        if (!ta.classList.contains('hidden')) ta.focus();
      }
    });
  });
  document.querySelectorAll('.notes-area').forEach(ta => {
    ta.addEventListener('input', () => {
      const id = ta.dataset.id;
      state[id] = state[id] || { status: 'pending', notes: '' };
      state[id].notes = ta.value;
      saveState();
    });
  });
}

function setStatus(id, status) {
  state[id] = state[id] || { notes: '' };
  state[id].status = status;
  saveState();
  renderSidebar();
  renderModule();
  renderOverall();
  renderDefects();
}

// ─── OVERALL / FILTROS / DEFECTOS ────────────────────────────────────────────
function renderOverall() {
  const o = overallProgress();
  const pct = o.total ? Math.round((o.done / o.total) * 100) : 0;
  document.getElementById('overallStats').textContent = `${o.done} aprobados · ${o.failed} fallados · ${o.total} totales`;
  document.getElementById('overallProgress').style.width = pct + '%';
  document.getElementById('overallPercent').textContent = pct + '%';
}

function renderDefects() {
  const failedItems = allItems().filter(it => state[it.id]?.status === 'failed');
  const root = document.getElementById('defectsList');
  let html = '';
  if (failedItems.length === 0 && defects.length === 0) {
    html = '<div class="text-slate-400 italic">Sin defectos registrados.</div>';
  } else {
    if (failedItems.length > 0) {
      html += `<div class="text-xs uppercase font-semibold text-slate-500 mb-1">Items marcados como fallados</div>`;
      for (const it of failedItems) {
        const sev = it.severity === 'critical' ? '🔴' : it.severity === 'important' ? '🟡' : '🔵';
        const notes = state[it.id]?.notes || '';
        html += `<div class="border border-rose-200 bg-rose-50 rounded p-2 text-sm">
          <div class="font-medium text-rose-800 flex items-center gap-2">${sev} ${it.modName}</div>
          <div class="text-slate-700">${it.text}</div>
          ${notes ? `<div class="text-xs text-slate-600 italic mt-1 whitespace-pre-wrap">${escapeHtml(notes)}</div>` : ''}
        </div>`;
      }
    }
    if (defects.length > 0) {
      html += `<div class="text-xs uppercase font-semibold text-slate-500 mb-1 mt-3">Defectos manuales</div>`;
      defects.forEach((d, i) => {
        const sev = d.severity === 'critical' ? '🔴' : d.severity === 'important' ? '🟡' : '🔵';
        html += `<div class="border border-rose-200 bg-rose-50 rounded p-2 text-sm flex items-start gap-2">
          <div class="flex-1">
            <div class="font-medium text-rose-800">${sev} ${escapeHtml(d.title)}</div>
            <div class="text-slate-700 whitespace-pre-wrap text-xs mt-1">${escapeHtml(d.description)}</div>
          </div>
          <button class="del-defect text-rose-500 hover:text-rose-700 text-xs" data-idx="${i}">Eliminar</button>
        </div>`;
      });
    }
  }
  root.innerHTML = html;
  root.querySelectorAll('.del-defect').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      defects.splice(idx, 1);
      saveDefects();
      renderDefects();
    });
  });
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ─── EXPORTAR ────────────────────────────────────────────────────────────────
function exportReport() {
  const o = overallProgress();
  const date = new Date().toLocaleString();
  let md = `# Reporte QA — Clubix\n\n_Generado: ${date}_\n\n`;
  md += `## Resumen\n\n`;
  md += `- Total: **${o.total}** ítems\n- Aprobados: **${o.done}**\n- Fallados: **${o.failed}**\n- Pendientes: **${o.total - o.done - o.failed}**\n- Porcentaje aprobado: **${Math.round((o.done / o.total) * 100)}%**\n\n`;

  for (const sec of QA_DATA) {
    md += `\n## ${sec.section}\n`;
    for (const mod of sec.modules) {
      const p = moduleProgress(mod);
      md += `\n### ${mod.name} (${p.done}/${p.total})\n\n`;
      mod.items.forEach((text, idx) => {
        const id = itemId(mod.id, idx);
        const e = state[id] || { status: 'pending', notes: '' };
        const mark = e.status === 'passed' ? '✅' : e.status === 'failed' ? '❌' : e.status === 'blocked' ? '⊘' : '⬜';
        md += `- ${mark} ${text}`;
        if (e.notes) md += `\n  > ${e.notes.replace(/\n/g, '\n  > ')}`;
        md += '\n';
      });
    }
  }

  const failed = allItems().filter(it => state[it.id]?.status === 'failed');
  if (failed.length || defects.length) {
    md += `\n## Defectos detectados\n\n`;
    failed.forEach(it => {
      const sev = it.severity === 'critical' ? 'CRÍTICO' : it.severity === 'important' ? 'IMPORTANTE' : 'COSMÉTICO';
      md += `### [${sev}] ${it.modName} — ${it.text}\n`;
      if (state[it.id]?.notes) md += `${state[it.id].notes}\n\n`; else md += '\n';
    });
    defects.forEach(d => {
      md += `### [${d.severity.toUpperCase()}] ${d.title}\n${d.description}\n\n`;
    });
  }

  const blob = new Blob([md], { type: 'text/markdown' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `qa-clubix-${new Date().toISOString().slice(0, 10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
}

// ─── EVENTOS GLOBALES ────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  if (searchQuery) activeModuleId = null;
  renderModule();
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('bg-indigo-600', 'text-white', 'border-indigo-600');
      b.classList.add('bg-white', 'border-slate-300', 'text-slate-700');
    });
    btn.classList.remove('bg-white', 'border-slate-300', 'text-slate-700');
    btn.classList.add('bg-indigo-600', 'text-white', 'border-indigo-600');
    if (activeFilter !== 'all') activeModuleId = null;
    renderModule();
  });
});
document.querySelectorAll('.sev-filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeSevFilter = btn.dataset.sevFilter;
    document.querySelectorAll('.sev-filter-btn').forEach(b => {
      b.classList.remove('bg-slate-700', 'text-white', 'border-slate-700');
    });
    btn.classList.add('bg-slate-700', 'text-white', 'border-slate-700');
    if (activeSevFilter !== 'all') activeModuleId = null;
    renderModule();
  });
});
document.getElementById('exportBtn').addEventListener('click', exportReport);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('¿Seguro que querés borrar TODOS los estados y defectos? Esta acción no se puede deshacer.')) {
    state = {};
    defects = [];
    saveState();
    saveDefects();
    renderSidebar();
    renderModule();
    renderOverall();
    renderDefects();
  }
});
document.getElementById('addDefectBtn').addEventListener('click', () => {
  const title = document.getElementById('defectTitle').value.trim();
  const desc = document.getElementById('defectDesc').value.trim();
  const sev = document.getElementById('defectSev').value;
  if (!title) { alert('Ingresá un título'); return; }
  defects.push({ title, description: desc, severity: sev, date: new Date().toISOString() });
  saveDefects();
  document.getElementById('defectTitle').value = '';
  document.getElementById('defectDesc').value = '';
  renderDefects();
});

// Init
renderSidebar();
renderModule();
renderOverall();
renderDefects();
</script>

</body>
